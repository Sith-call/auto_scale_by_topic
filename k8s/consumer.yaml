apiVersion: v1
kind: Service
metadata:
  name: message-consumer
  labels:
    app: message-consumer
spec:
  clusterIP: None
  selector:
    app: message-consumer
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: message-consumer
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: message-consumer-role
rules:
- apiGroups: ["apps"]
  resources: ["deployments", "statefulsets"]
  verbs: ["get", "list", "watch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: message-consumer-binding
subjects:
- kind: ServiceAccount
  name: message-consumer
  namespace: default
roleRef:
  kind: ClusterRole
  name: message-consumer-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: message-consumer
  labels:
    app: message-consumer
spec:
  serviceName: message-consumer
  replicas: 1
  selector:
    matchLabels:
      app: message-consumer
  template:
    metadata:
      labels:
        app: message-consumer
    spec:
      serviceAccountName: message-consumer
      containers:
      - name: consumer
        image: message-consumer:latest
        imagePullPolicy: Never
        env:
        - name: RABBITMQ_URL
          value: "amqp://guest:guest@rabbitmq:5672/"
        - name: CONSUMER_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: TOTAL_CONSUMERS
          value: "1"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        # 헬스체크 설정
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - "ps aux | grep -v grep | grep consumer"
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - "ps aux | grep -v grep | grep consumer"
          initialDelaySeconds: 10
          periodSeconds: 10 